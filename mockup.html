/* ============================================================
   FICHES — panneau coulissant unique pour tous les modules
============================================================ */
function fields(items){
  return `<div class="field-grid">${items.map(([l,v,span])=>
    `<div class="field ${span?'span-2':''}"><span class="field-label">${l}</span><span class="field-value">${v==null||v===''?'—':v}</span></div>`).join('')}</div>`;
}
function sousTitre(txt){ return `<div class="settings-group-title" style="font-size:12.5px;margin:22px 0 10px">${esc(txt)}</div>`; }

/* Tableau des lignes d'un document de vente */
function lignesHTML(doc){
  const rows = doc.lignes.map(l => {
    const m = ligneMontants(l);
    return `<tr>
      <td class="cell-primary mono-num">${esc(l.code)}</td>
      <td>${esc(l.des)}</td>
      <td class="cell-muted">${esc(l.u)}</td>
      <td class="cell-num">${groupInt(Math.abs(l.qte))}${l.qte<0?' −':''}</td>
      <td class="cell-num">${fmtDA(l.pu)}</td>
      <td class="cell-num">${l.remisePct ? l.remisePct+' %' : '—'}</td>
      <td class="cell-num" style="font-weight:600">${fmtDA(m.net)}</td>
    </tr>`;
  }).join('');
  const p = computePied(doc);
  return `<table class="mini-table">
    <thead><tr><th>Code</th><th>Désignation</th><th>U.</th><th class="th-num">Quantité</th><th class="th-num">P.U. HT</th><th class="th-num">Remise</th><th class="th-num">Montant HT</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="6" style="font-weight:600;padding-top:9px">Total HT des lignes, remises déduites</td>
      <td class="cell-num" style="font-weight:700;padding-top:9px">${fmtDA(p.totalBrut - p.totalRemises)}</td></tr></tfoot>
  </table>`;
}

/* Pied de facture — ordre strict du §4.4.6, remise ligne et rabais global distincts */
function piedHTML(doc){
  const p = computePied(doc);
  const soumis = BAREME_TIMBRE.modesSoumis.includes(doc.mode);
  const plafonne = soumis && p.timbre === BAREME_TIMBRE.plafond;
  return `<div class="pied" style="max-width:420px;margin-left:auto">
    <div class="pl"><span>Total HT des lignes</span><span>${fmtDA(p.totalBrut)}</span></div>
    <div class="pl"><span>− Remises sur lignes <span class="hint">accordées ligne par ligne</span></span><span>${fmtDA(p.totalRemises)}</span></div>
    <div class="pl"><span>− Rabais global ${doc.rabaisPct?`<span class="hint">${String(doc.rabaisPct).replace('.',',')} %</span>`:''}</span><span>${fmtDA(p.rabais)}</span></div>
    <div class="pl sub"><span>= Net commercial HT</span><span>${fmtDA(p.netCommercial)}</span></div>
    <div class="pl"><span>− Remboursement d’avance ${doc.avancePct?`<span class="hint">prorata ${doc.avancePct} %</span>`:''}</span><span>${fmtDA(p.avance)}</span></div>
    <div class="pl"><span>− Retenue de garantie ${doc.retenuePct?`<span class="hint">${doc.retenuePct} % sur base HT</span>`:''}</span><span>${fmtDA(p.retenue)}</span></div>
    <div class="pl sub"><span>= Total HT facture</span><span>${fmtDA(p.totalHT)}</span></div>
    <div class="pl"><span>+ TVA <span class="hint">${TVA_TAUX} %</span></span><span>${fmtDA(p.tva)}</span></div>
    <div class="pl sub"><span>= Total TTC</span><span>${fmtDA(p.ttc)}</span></div>
    <div class="pl"><span>+ Droit de timbre <span class="hint">${soumis ? esc(doc.mode.toLowerCase()) + (plafonne?' — plafond atteint':'') : 'non applicable au '+esc(doc.mode.toLowerCase())}</span></span><span>${fmtDA(p.timbre)}</span></div>
    <div class="pnet"><b>Net à payer</b><strong>${fmtDA(p.net)}</strong></div>
    <div class="pnote">Montants arrondis à deux décimales ligne par ligne puis au total du document.
    ${soumis ? 'Droit de timbre liquidé selon le barème paramétrable §4.7.3.' : 'Le virement et le LCN ne supportent jamais le droit de timbre.'}</div>
  </div>`;
}

function validerFacture(id){
  const f = facture(id);
  const suivants = FACTURES.filter(x=>x.num && x.type==='FA').map(x=>parseInt(x.num.slice(-5),10));
  const num = 'FA-2026-' + String(Math.max.apply(null, suivants) + 1).padStart(5,'0');
  const p = computePied(f);
  openModal({
    ton:'orange', ico:'lock', titre:'Valider définitivement cette facture ?',
    texte:'La validation attribue le numéro de série et <b>le verrouille définitivement</b>. Le document ne pourra plus être modifié ni supprimé : toute correction passera par un avoir.',
    detail:`<div class="callout callout-blue">${icon('info')}<div>
        Numéro qui sera attribué : <b class="mono-num">${num}</b><br>
        Client : ${esc(client(f.clientId).sigle)} · Net à payer : <b class="mono-num">${fmtDA(p.net)}</b><br>
        Tant que la facture reste au brouillon, aucun numéro n’est consommé.
      </div></div>`,
    annuler:'Rester en brouillon', confirmer:'Valider et attribuer le numéro',
    onConfirm:()=>{
      f.num = num; f.statut = 'Validée';
      render(); openFiche('facture', id);
      toast('Facture ' + num + ' validée — numéro attribué définitivement');
    }});
}

const FICHES = {};

/* ---------- Fiche client ---------- */
FICHES.client = (id, onglet) => {
  const c = client(id);
  const onglets = ['Identité','Encours et règlements','Documents'];
  const act = onglets.includes(onglet) ? onglet : onglets[0];
  const fs = FACTURES.filter(f=>f.clientId===id);
  const as = AFFAIRES.filter(a=>a.clientId===id);
  let corps = '';

  if(act === 'Identité'){
    corps = fields([
      ['Code client', `<span class="mono-num">${esc(c.code)}</span>`],
      ['Statut', badge(c.statut)],
      ['Raison sociale', esc(c.nom), true],
      ['Secteur', esc(c.secteur)], ['Ville', esc(c.ville)],
      ['NIF', `<span class="mono-num">${esc(c.nif)}</span>`], ['NIS', `<span class="mono-num">${esc(c.nis)}</span>`],
      ['Registre de commerce', `<span class="mono-num">${esc(c.rc)}</span>`], ['Client depuis', fmtDate(c.depuis)],
      ['Adresse', esc(c.adresse), true],
    ]) + sousTitre('Interlocuteur') + fields([
      ['Contact', esc(c.contact)], ['Fonction', esc(c.fonction)],
      ['Téléphone', `<span class="mono-num">${esc(c.tel)}</span>`], ['Courriel', esc(c.email)],
    ]);
    if(c.statut === 'En vigilance'){
      corps += `<div class="divider"></div><div class="callout callout-red">${icon('alertTriangle')}
        <div><b>Client placé en vigilance.</b> Deux règlements sont intervenus avec plus de 45 jours de retard sur les douze derniers mois.
        La facturation et la livraison restent possibles : l’application signale, elle ne bloque pas.</div></div>`;
    }
  }

  if(act === 'Encours et règlements'){
    const depasse = c.encours > c.plafond;
    corps = fields([
      ['Score de solvabilité', scoreBadge(c.score)], ['Délai de règlement contractuel', c.delai + ' jours'],
      ['Encours actuel', `<span class="mono-num" ${depasse?'style="color:var(--red);font-weight:700"':''}>${fmtDA(c.encours)}</span>`],
      ['Plafond de crédit', `<span class="mono-num">${fmtDA(c.plafond)}</span>`],
    ]);
    if(depasse){
      corps += `<div class="divider"></div><div class="callout callout-orange">${icon('alertTriangle')}
        <div><b>Plafond de crédit dépassé de ${fmtDA(c.encours - c.plafond)}.</b>
        Signalement visuel uniquement — la création de nouveaux documents reste autorisée (§5.3).</div></div>`;
    }
    corps += sousTitre('Documents de vente') + (fs.length ? `<table class="mini-table">
      <thead><tr><th>Document</th><th>Date</th><th class="th-num">Net à payer</th><th class="th-num">Reste dû</th><th>État</th></tr></thead>
      <tbody>${fs.map(f=>`<tr onclick="openFiche('facture','${f.id}')">
        <td class="cell-primary mono-num">${esc(f.num||'Brouillon')}</td><td class="cell-muted">${fmtDate(f.date)}</td>
        <td class="cell-num">${fmtDA(computePied(f).net)}</td>
        <td class="cell-num">${f.statut==='Brouillon'?'—':fmtDA(resteDu(f))}</td>
        <td>${badge(f.statut)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucun document émis.</div>`);
  }

  if(act === 'Documents'){
    corps = sousTitre('Affaires') + (as.length ? `<table class="mini-table">
      <thead><tr><th>Affaire</th><th>Intitulé</th><th class="th-num">Montant</th><th>État</th></tr></thead>
      <tbody>${as.map(a=>`<tr onclick="openFiche('affaire','${a.id}')">
        <td class="cell-primary mono-num">${esc(a.num)}</td><td>${esc(a.intitule)}</td>
        <td class="cell-num">${fmtDAc(a.montant)}</td><td>${badge(a.statut)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucune affaire rattachée.</div>`);
    const ds = DEVIS.filter(d=>d.clientId===id);
    corps += sousTitre('Devis') + (ds.length ? `<table class="mini-table">
      <thead><tr><th>Devis</th><th>Objet</th><th class="th-num">Montant HT</th><th>État</th></tr></thead>
      <tbody>${ds.map(d=>`<tr onclick="openFiche('devis','${d.id}')">
        <td class="cell-primary mono-num">${esc(d.num)}</td><td>${esc(d.objet)}</td>
        <td class="cell-num">${fmtDA(computePied(d).netCommercial)}</td><td>${badge(d.statut)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucun devis.</div>`);
  }

  return {titre:esc(c.sigle), sousTitre:`${esc(c.code)} · ${esc(c.nom)}`, onglets, ongletActif:act, corps,
    pied:`<button class="btn btn-primary" onclick="toast('Modification — écran de saisie non implémenté')">Modifier</button>
          <button class="btn btn-secondary" onclick="toast('Relevé de compte client généré dans Documents/EGTO')">${icon('download')}Relevé de compte</button>`};
};

/* ---------- Fiche affaire ---------- */
FICHES.affaire = (id, onglet) => {
  const a = affaire(id); const c = client(a.clientId);
  const onglets = ['Synthèse','Devis quantitatif','Facturation','Garanties'];
  const act = onglets.includes(onglet) ? onglet : onglets[0];
  let corps = '';

  if(act === 'Synthèse'){
    corps = fields([
      ['N° affaire', `<span class="mono-num">${esc(a.num)}</span>`], ['État', badge(a.statut)],
      ['Intitulé', esc(a.intitule), true],
      ['Client', esc(c.nom)], ['Nature du marché', esc(a.marche) + ' — ' + esc(a.typeTravaux)],
      ['N° de marché', `<span class="mono-num">${esc(a.numMarche)}</span>`], ['Montant du marché', `<span class="mono-num">${fmtDA(a.montant)}</span>`],
      ['Ordre de service', fmtDate(a.ods)], ['Délai contractuel', a.delaiMois + ' mois'],
      ['Fin prévisionnelle', fmtDate(a.finPrevue)], ['Révision des prix', esc(a.revision)],
      ['Avance forfaitaire', a.avancePct ? a.avancePct + ' %' : 'Aucune'], ['Retenue de garantie', a.retenuePct + ' % sur base HT'],
    ]);
    corps += sousTitre('Avancement') + `
      <div class="flex items-center gap-12" style="margin-bottom:14px">
        <div class="progress-bar" style="width:180px;height:7px"><div style="width:${a.avancement}%"></div></div>
        <span class="mono-num" style="font-weight:600">${a.avancement} %</span>
      </div>` + fields([
      ['Facturé à ce jour', `<span class="mono-num">${fmtDA(a.facture)}</span>`],
      ['Encaissé à ce jour', `<span class="mono-num">${fmtDA(a.encaisse)}</span>`],
      ['Reste à facturer', `<span class="mono-num">${fmtDA(a.montant - a.facture)}</span>`],
      ['Reste à encaisser', `<span class="mono-num">${fmtDA(a.facture - a.encaisse)}</span>`],
    ]);
    if(!a.ods){
      corps += `<div class="divider"></div><div class="callout callout-blue">${icon('info')}
        <div>Marché signé, <b>ordre de service non encore notifié</b>. Le décompte du délai contractuel ne démarre qu’à réception de l’ODS.</div></div>`;
    }
  }

  if(act === 'Devis quantitatif'){
    const d = DQE[id];
    corps = d ? `
      <div class="callout callout-blue" style="margin-bottom:14px">${icon('info')}
        <div>Saisie de masse : dans l’application, ce tableau est édité en grille avec saisie au clavier, copier-coller depuis Excel et recalcul immédiat.</div></div>
      <table class="mini-table">
        <thead><tr><th>N°</th><th>Désignation</th><th>U.</th><th class="th-num">Quantité</th><th class="th-num">P.U. HT</th><th class="th-num">Montant HT</th><th class="th-num">Réalisé</th></tr></thead>
        <tbody>${d.map(l=>`<tr>
          <td class="cell-primary mono-num">${l.n}</td><td>${esc(l.des)}</td><td class="cell-muted">${l.u}</td>
          <td class="cell-num">${groupInt(l.qte)}</td><td class="cell-num">${fmtDA(l.pu)}</td>
          <td class="cell-num" style="font-weight:600">${fmtDA(r2(l.qte*l.pu))}</td>
          <td class="cell-num">${l.fait} %</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="5" style="font-weight:600;padding-top:9px">Total du devis quantitatif estimatif</td>
          <td class="cell-num" style="font-weight:700;padding-top:9px">${fmtDA(d.reduce((s,l)=>s+r2(l.qte*l.pu),0))}</td><td></td></tr></tfoot>
      </table>` : `<div class="text-tertiary" style="font-size:12px">Aucun devis quantitatif saisi pour cette affaire.</div>`;
  }

  if(act === 'Facturation'){
    const fs = FACTURES.filter(f=>f.affaireId===id);
    const bs = blDe(id);
    corps = (fs.length ? `<table class="mini-table">
      <thead><tr><th>Document</th><th>Objet</th><th>Date</th><th class="th-num">Net à payer</th><th>État</th></tr></thead>
      <tbody>${fs.map(f=>`<tr onclick="openFiche('facture','${f.id}')">
        <td class="cell-primary mono-num">${esc(f.num||'Brouillon')}</td><td>${esc(f.objet)}</td>
        <td class="cell-muted">${fmtDate(f.date)}</td><td class="cell-num">${fmtDA(computePied(f).net)}</td>
        <td>${badge(f.statut)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucun document de vente rattaché.</div>`);
    corps += sousTitre('Bons de livraison') + (bs.length ? `<table class="mini-table">
      <thead><tr><th>N° BL</th><th>Date</th><th>Chantier</th><th class="th-num">Montant HT</th><th>État</th></tr></thead>
      <tbody>${bs.map(b=>`<tr onclick="openFiche('bl','${b.num}')">
        <td class="cell-primary mono-num">${esc(b.num)}</td><td class="cell-muted">${fmtDate(b.date)}</td>
        <td>${esc(b.chantier)}</td><td class="cell-num">${fmtDA(b.lignes.reduce((s,l)=>s+ligneMontants(l).net,0))}</td>
        <td>${badge(b.statut)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucun bon de livraison.</div>`);
  }

  if(act === 'Garanties'){
    const cs = CAUTIONS.filter(x=>x.affaireId===id);
    const r  = RETENUES.find(x=>x.affaireId===id);
    corps = sousTitre('Cautions bancaires') + (cs.length ? `<table class="mini-table">
      <thead><tr><th>N°</th><th>Type</th><th class="th-num">Montant</th><th>Expiration</th><th>État</th></tr></thead>
      <tbody>${cs.map(x=>`<tr onclick="openFiche('caution','${x.num}')">
        <td class="cell-primary mono-num">${esc(x.num)}</td><td>${esc(x.type)}</td>
        <td class="cell-num">${fmtDA(x.montant)}</td><td class="cell-muted">${fmtDate(x.expiration)}</td>
        <td>${badge(x.statut)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucune caution.</div>`);
    corps += sousTitre('Retenue de garantie') + (r ? fields([
      ['Taux appliqué', r.tauxPct + ' % sur base HT'], ['État', badge(r.statut)],
      ['Montant retenu', `<span class="mono-num">${fmtDA(r.retenu)}</span>`],
      ['Montant libéré', `<span class="mono-num">${fmtDA(r.libere)}</span>`],
      ['Solde immobilisé', `<span class="mono-num" style="font-weight:700">${fmtDA(r.retenu-r.libere)}</span>`],
      ['Échéance de libération', fmtDate(r.echeance)],
    ]) : `<div class="text-tertiary" style="font-size:12px">Aucune retenue.</div>`);
    const st = SOUSTRAITANTS.flatMap(s=>s.contrats.filter(ct=>ct.affaireId===id).map(ct=>({s,ct})));
    corps += sousTitre('Sous-traitance') + (st.length ? `<table class="mini-table">
      <thead><tr><th>Contrat</th><th>Sous-traitant</th><th class="th-num">Montant</th><th>État</th></tr></thead>
      <tbody>${st.map(({s,ct})=>`<tr onclick="openFiche('soustraitant','${s.id}')">
        <td class="cell-primary mono-num">${esc(ct.num)}</td><td>${esc(s.nom)}</td>
        <td class="cell-num">${fmtDA(ct.montant)}</td><td>${badge(ct.statut)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucun contrat de sous-traitance.</div>`);
  }

  return {titre:esc(a.num), sousTitre:esc(a.intitule), onglets, ongletActif:act, corps,
    pied:`<button class="btn btn-primary" onclick="toast('Création d’une situation de travaux — écran non implémenté')">Nouvelle situation</button>
          <button class="btn btn-secondary" onclick="toast('Fiche affaire exportée en PDF dans Documents/EGTO')">${icon('download')}Fiche PDF</button>`};
};
/* ---------- Fiche devis ---------- */
FICHES.devis = (id, onglet) => {
  const d = DEVIS.find(x=>x.id===id); const c = client(d.clientId);
  const onglets = ['Détail','Lignes et totaux'];
  const act = onglets.includes(onglet) ? onglet : onglets[1];
  const exp = daysUntil(d.validite);
  let corps = '';

  if(act === 'Détail'){
    corps = fields([
      ['N° devis', `<span class="mono-num">${esc(d.num)}</span>`], ['État', badge(d.statut)],
      ['Objet', esc(d.objet), true],
      ['Client', esc(c.nom)], ['Interlocuteur', esc(c.contact)],
      ['Date d’émission', fmtDate(d.date)], ['Valable jusqu’au', fmtDate(d.validite)],
      ['Probabilité de conclusion', d.proba + ' %'], ['Mode de règlement prévu', esc(d.mode)],
    ]);
    if(d.converti){
      corps += `<div class="divider"></div><div class="callout callout-green">${icon('checkCircle')}
        <div>Devis accepté et <b>converti en affaire ${esc(d.converti)}</b>. Les lignes ont été reprises telles quelles dans le devis quantitatif estimatif.</div></div>`;
    } else if(d.motifRefus){
      corps += `<div class="divider"></div><div class="callout callout-red">${icon('x')}
        <div><b>Devis refusé.</b> Motif consigné : ${esc(d.motifRefus)}.</div></div>`;
    } else if(d.statut === 'Envoyé' && exp <= 30){
      corps += `<div class="divider"></div><div class="callout callout-orange">${icon('clockAlert')}
        <div>${exp < 0 ? `Validité dépassée depuis ${-exp} jours.` : `La validité expire dans ${exp} jours.`} Une relance de l’interlocuteur est recommandée.</div></div>`;
    }
  }

  if(act === 'Lignes et totaux'){
    corps = lignesHTML(d) + `<div class="divider"></div>` + piedHTML(d);
  }

  return {titre:esc(d.num), sousTitre:`${esc(c.sigle)} · ${esc(d.objet)}`, onglets, ongletActif:act, corps,
    pied: d.statut === 'Accepté' && !d.converti
      ? `<button class="btn btn-primary" onclick="toast('Conversion en affaire — écran non implémenté')">Convertir en affaire</button>
         <button class="btn btn-secondary" onclick="toast('Devis imprimé dans Documents/EGTO')">${icon('download')}Imprimer</button>`
      : `<button class="btn btn-secondary" onclick="toast('Devis imprimé dans Documents/EGTO')">${icon('download')}Imprimer le devis</button>
         <button class="btn btn-ghost" onclick="toast('Duplication — écran non implémenté')">Dupliquer</button>`};
};

/* ---------- Fiche facture — même panneau coulissant que partout ailleurs ---------- */
FICHES.facture = (id, onglet) => {
  const f = facture(id); const c = client(f.clientId); const a = affaire(f.affaireId);
  const onglets = ['Lignes et pied de facture','Détail','Règlements','Traçabilité'];
  const act = onglets.includes(onglet) ? onglet : onglets[0];
  const brouillon = f.statut === 'Brouillon';
  const p = computePied(f);
  let corps = '';

  if(brouillon){
    corps += `<div class="callout callout-orange" style="margin-bottom:16px">${icon('lock')}
      <div><b>Brouillon — aucun numéro attribué.</b> Le numéro de série n’est délivré qu’à la validation :
      supprimer ce brouillon ne créera aucun trou dans la séquence des documents validés (§4.4.2).</div></div>`;
  }
  const retard = retardJours(f);
  if(retard > 0){
    corps += `<div class="callout callout-red" style="margin-bottom:16px">${icon('alertTriangle')}
      <div><b>Échéance dépassée de ${retard} jours.</b> Reste dû ${fmtDA(resteDu(f))} — relance recommandée, aucune action n’est bloquée.</div></div>`;
  }

  if(act === 'Lignes et pied de facture'){
    corps += lignesHTML(f) + `<div class="divider"></div>` + piedHTML(f);
  }

  if(act === 'Détail'){
    corps += fields([
      ['N° document', f.num ? `<span class="mono-num">${esc(f.num)}</span>` : '<span class="text-tertiary">non attribué</span>'],
      ['Type', TYPE_LABEL[f.type]],
      ['Objet', esc(f.objet), true],
      ['Client', esc(c.nom)], ['NIF client', `<span class="mono-num">${esc(c.nif)}</span>`],
      ['Affaire', a ? `<span class="mono-num">${esc(a.num)}</span> — ${esc(a.intitule)}` : 'Vente hors marché', true],
      ['Date du document', fmtDate(f.date)], ['Échéance de règlement', brouillon ? '—' : fmtDate(f.echeance)],
      ['Mode de règlement', esc(f.mode)], ['État', badge(f.statut)],
      ['Rabais global', f.rabaisPct ? String(f.rabaisPct).replace('.',',') + ' %' : 'Aucun'],
      ['Retenue de garantie', f.retenuePct ? f.retenuePct + ' % sur base HT' : 'Aucune'],
      ['Remboursement d’avance', f.avancePct ? 'Prorata ' + f.avancePct + ' %' : 'Aucun'],
      ['Référence', f.ref ? `<span class="mono-num">${esc(f.ref)}</span>` : '—'],
    ]);
    corps += `<div class="divider"></div><div class="callout callout-blue">${icon('info')}
      <div>Mentions portées au document imprimé : ${esc(SOCIETE.forme)} · NIF ${esc(SOCIETE.nif)} · NIS ${esc(SOCIETE.nis)} ·
      RC ${esc(SOCIETE.rc)} · article d’imposition ${esc(SOCIETE.ai)} · ${esc(SOCIETE.banque)}.</div></div>`;
  }

  if(act === 'Règlements'){
    const es = encaissementsDe(f.id);
    corps += fields([
      ['Net à payer', `<span class="mono-num" style="font-weight:700">${fmtDA(p.net)}</span>`],
      ['Reste dû', `<span class="mono-num" style="font-weight:700;${resteDu(f)>0?'color:var(--red)':'color:var(--green)'}">${fmtDA(resteDu(f))}</span>`],
    ]);
    corps += sousTitre('Encaissements affectés') + (es.length ? `<table class="mini-table">
      <thead><tr><th>N°</th><th>Date</th><th>Mode</th><th>Référence</th><th class="th-num">Montant</th></tr></thead>
      <tbody>${es.map(e=>`<tr onclick="openFiche('encaissement','${e.num}')">
        <td class="cell-primary mono-num">${esc(e.num)}</td><td class="cell-muted">${fmtDate(e.date)}</td>
        <td>${esc(e.mode)}</td><td class="cell-muted">${esc(e.ref)}</td>
        <td class="cell-num">${fmtDA(e.montant)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucun encaissement enregistré sur ce document.</div>`);
    if(f.retenuePct){
      corps += sousTitre('Retenue de garantie prélevée') + `<div class="callout callout-blue">${icon('info')}
        <div>${fmtDA(p.retenue)} ont été retenus sur cette facture au titre de la garantie ${f.retenuePct} %.
        Cette somme n’est pas une créance échue : elle se libère à la réception (§4.12.2).</div></div>`;
    }
  }

  if(act === 'Traçabilité'){
    const bs = BONS_LIVRAISON.filter(b=>b.factureNum === f.num);
    const evts = [
      {d:f.date, t:'Création du brouillon', s:'Saisie manuelle — poste unique'},
      f.num ? {d:f.date, t:'Validation et attribution du numéro ' + f.num, s:'Numéro verrouillé, document non modifiable'} : null,
      f.statut === 'Envoyée' || f.statut === 'Payée' ? {d:f.date, t:'Impression et envoi au client', s:'PDF écrit dans Documents/EGTO/factures'} : null,
      f.statut === 'Payée' ? {d:(encaissementsDe(f.id)[0]||{}).date, t:'Règlement intégral constaté', s:'Rapprochement automatique du reste dû'} : null,
    ].filter(Boolean);
    corps += `<div class="callout callout-blue" style="margin-bottom:14px">${icon('shieldCheck')}
      <div>Le journal d’audit est alimenté par déclencheurs de base de données, jamais par le code applicatif :
      aucune écriture ne peut échapper à la trace.</div></div>`;
    corps += evts.map(e=>`<div class="alert-row">
      <div class="alert-icon" style="background:var(--accent-soft);color:var(--accent)">${icon('checkCircle')}</div>
      <div><div class="alert-title">${esc(e.t)}</div><div class="alert-sub">${fmtDate(e.d)} · ${esc(e.s)}</div></div></div>`).join('');
    corps += sousTitre('Bons de livraison repris') + (bs.length ? `<table class="mini-table">
      <thead><tr><th>N° BL</th><th>Date</th><th>Chantier</th><th class="th-num">Montant HT</th></tr></thead>
      <tbody>${bs.map(b=>`<tr onclick="openFiche('bl','${b.num}')">
        <td class="cell-primary mono-num">${esc(b.num)}</td><td class="cell-muted">${fmtDate(b.date)}</td>
        <td>${esc(b.chantier)}</td><td class="cell-num">${fmtDA(b.lignes.reduce((s,l)=>s+ligneMontants(l).net,0))}</td></tr>`).join('')}</tbody></table>`
      : `<div class="text-tertiary" style="font-size:12px">Aucun bon de livraison repris.</div>`);
  }

  const pied = brouillon
    ? `<button class="btn btn-primary" onclick="validerFacture('${f.id}')">${icon('lock')}Valider la facture</button>
       <button class="btn btn-secondary" onclick="toast('Modification du brouillon — écran non implémenté')">Modifier</button>
       <button class="btn btn-danger" onclick="supprimerBrouillon('${f.id}')">Supprimer</button>`
    : `<button class="btn btn-primary" onclick="toast('${esc(f.num)} imprimée dans Documents/EGTO/factures')">${icon('download')}Imprimer le PDF</button>
       ${f.statut!=='Payée' && f.type!=='AV' ? `<button class="btn btn-secondary" onclick="toast('Saisie d’un encaissement — écran non implémenté')">Enregistrer un règlement</button>` : ''}
       <button class="btn btn-ghost" onclick="toast('Duplication — écran non implémenté')">Dupliquer</button>`;

  return {titre: f.num ? esc(f.num) : 'Facture au brouillon',
    sousTitre:`${esc(c.sigle)} · ${esc(f.objet)}`, onglets, ongletActif:act, corps, pied};
};

function supprimerBrouillon(id){
  const f = facture(id);
  openModal({ton:'red', ico:'alertTriangle', titre:'Supprimer ce brouillon ?',
    texte:'Le document sera marqué comme supprimé sans jamais être effacé physiquement de la base — il reste consultable dans le journal d’audit.',
    detail:`<div class="callout callout-blue">${icon('info')}<div>Aucun numéro n’ayant été attribué, la suppression <b>ne consomme pas de numéro</b> et laisse la séquence des documents validés intacte.</div></div>`,
    annuler:'Conserver', confirmer:'Supprimer le brouillon',
    onConfirm:()=>{ closeFiche(); toast('Brouillon supprimé — aucun numéro consommé'); }});
}

/* ---------- Fiche bon de livraison ---------- */
FICHES.bl = (num) => {
  const b = BONS_LIVRAISON.find(x=>x.num===num); const c = client(b.clientId); const a = affaire(b.affaireId);
  const total = b.lignes.reduce((s,l)=>s+ligneMontants(l).net, 0);
  const corps = fields([
    ['N° BL', `<span class="mono-num">${esc(b.num)}</span>`], ['État', badge(b.statut)],
    ['Date de livraison', fmtDate(b.date)], ['Client', esc(c.sigle)],
    ['Chantier', esc(b.chantier), true],
    ['Affaire', a ? `<span class="mono-num">${esc(a.num)}</span>` : 'Vente hors marché'],
    ['Facture de reprise', b.factureNum ? `<span class="mono-num">${esc(b.factureNum)}</span>` : '<span class="text-tertiary">non facturé</span>'],
    ['Immatriculation', `<span class="mono-num">${esc(b.camion)}</span>`], ['Chauffeur', esc(b.chauffeur)],
  ]) + sousTitre('Quantités livrées') + `<table class="mini-table">
    <thead><tr><th>Code</th><th>Désignation</th><th>U.</th><th class="th-num">Quantité</th><th class="th-num">P.U. HT</th><th class="th-num">Montant HT</th></tr></thead>
    <tbody>${b.lignes.map(l=>`<tr><td class="cell-primary mono-num">${esc(l.code)}</td><td>${esc(l.des)}</td>
      <td class="cell-muted">${esc(l.u)}</td><td class="cell-num">${groupInt(l.qte)}</td>
      <td class="cell-num">${fmtDA(l.pu)}</td><td class="cell-num" style="font-weight:600">${fmtDA(ligneMontants(l).net)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="5" style="font-weight:600;padding-top:9px">Total livré HT</td>
      <td class="cell-num" style="font-weight:700;padding-top:9px">${fmtDA(total)}</td></tr></tfoot></table>`
  + `<div class="divider"></div><div class="callout callout-blue">${icon('info')}
      <div>Le bon de livraison ne porte ni TVA, ni droit de timbre, ni retenue : il constate une livraison.
      La liquidation fiscale intervient sur la facture qui le reprend.</div></div>`;
  return {titre:esc(b.num), sousTitre:`${esc(c.sigle)} · ${esc(b.chantier)}`, onglets:[], ongletActif:null, corps,
    pied: b.statut === 'Facturé'
      ? `<button class="btn btn-secondary" onclick="toast('Bon de livraison imprimé dans Documents/EGTO')">${icon('download')}Imprimer le BL</button>`
      : `<button class="btn btn-primary" onclick="toast('Reprise du BL dans une facture — écran non implémenté')">Facturer ce bon</button>
         <button class="btn btn-secondary" onclick="toast('Bon de livraison imprimé dans Documents/EGTO')">${icon('download')}Imprimer</button>`};
};

/* ---------- Fiche encaissement ---------- */
FICHES.encaissement = (num) => {
  const e = ENCAISSEMENTS.find(x=>x.num===num); const c = client(e.clientId); const f = facture(e.factureId);
  let corps = fields([
    ['N° encaissement', `<span class="mono-num">${esc(e.num)}</span>`], ['Affectation', badge(e.statut)],
    ['Date de valeur', fmtDate(e.date)], ['Client', esc(c.sigle)],
    ['Mode de règlement', esc(e.mode)], ['Domiciliation', esc(e.banque)],
    ['Référence', esc(e.ref), true],
    ['Montant encaissé', `<span class="mono-num" style="font-weight:700">${fmtDA(e.montant)}</span>`],
    ['Document soldé', f ? `<span class="mono-num">${esc(f.num)}</span>` : '<span class="text-tertiary">non affecté</span>'],
  ]);
  if(f){
    corps += sousTitre('Document réglé') + `<table class="mini-table">
      <thead><tr><th>Document</th><th>Objet</th><th class="th-num">Net à payer</th><th class="th-num">Reste dû</th></tr></thead>
      <tbody><tr onclick="openFiche('facture','${f.id}')">
        <td class="cell-primary mono-num">${esc(f.num)}</td><td>${esc(f.objet)}</td>
        <td class="cell-num">${fmtDA(computePied(f).net)}</td><td class="cell-num">${fmtDA(resteDu(f))}</td></tr></tbody></table>`;
    if(e.partiel){
      corps += `<div class="divider"></div><div class="callout callout-orange">${icon('info')}
        <div><b>Règlement partiel.</b> Le solde de ${fmtDA(resteDu(f))} reste dû sur ${esc(f.num)}.</div></div>`;
    }
  } else {
    corps += `<div class="divider"></div><div class="callout callout-orange">${icon('alertTriangle')}
      <div><b>Encaissement non affecté.</b> Le versement a été constaté sans document de référence : à rapprocher d’une facture du client ${esc(c.sigle)}.</div></div>`;
  }
  return {titre:esc(e.num), sousTitre:`${esc(c.sigle)} · ${esc(e.mode)} · ${fmtDate(e.date)}`, onglets:[], ongletActif:null, corps,
    pied: e.factureId
      ? `<button class="btn btn-secondary" onclick="toast('Reçu imprimé dans Documents/EGTO')">${icon('download')}Imprimer le reçu</button>`
      : `<button class="btn btn-primary" onclick="toast('Affectation à une facture — écran non implémenté')">Affecter à une facture</button>`};
};
/* ---------- Fiche caution ---------- */
FICHES.caution = (num) => {
  const k = CAUTIONS.find(x=>x.num===num); const a = affaire(k.affaireId); const c = client(k.clientId);
  const j = daysUntil(k.expiration);
  let corps = '';
  if(k.statut !== 'Mainlevée obtenue' && j <= 30){
    corps += `<div class="callout callout-${j<=15?'red':'orange'}" style="margin-bottom:16px">${icon('clockAlert')}
      <div><b>${j < 0 ? `Caution expirée depuis ${-j} jours.` : `Expiration dans ${j} jours.`}</b>
      Le signalement intervient à J-30 puis à J-15 (§4.11.3). Demander la mainlevée au maître de l’ouvrage
      ou solliciter une prorogation auprès de ${esc(k.banque.split('—')[0].trim())}.</div></div>`;
  }
  corps += fields([
    ['N° caution', `<span class="mono-num">${esc(k.num)}</span>`], ['État', badge(k.statut)],
    ['Type de garantie', esc(k.type)], ['Taux appliqué', k.tauxPct + ' % du marché'],
    ['Affaire', `<span class="mono-num">${esc(a.num)}</span> — ${esc(a.intitule)}`, true],
    ['Bénéficiaire', esc(c.nom)], ['Banque émettrice', esc(k.banque)],
    ['Référence bancaire', `<span class="mono-num">${esc(k.ref)}</span>`],
    ['Montant garanti', `<span class="mono-num" style="font-weight:700">${fmtDA(k.montant)}</span>`],
    ['Date d’émission', fmtDate(k.emission)], ['Date d’expiration', fmtDate(k.expiration)],
    ['Commission bancaire', `<span class="mono-num">${fmtDA(k.commission)}</span>`],
    ['Jours restants', k.statut === 'Mainlevée obtenue' ? '—' : (j < 0 ? `échue depuis ${-j} j` : j + ' jours')],
  ]);
  corps += sousTitre('Cycle de vie') + [
    {t:'Émission de la caution', d:k.emission, ok:true},
    {t:'Alerte J-30', d:null, ok:j<=30},
    {t:'Alerte J-15', d:null, ok:j<=15},
    {t:'Demande de mainlevée', d:null, ok:['Mainlevée demandée','Mainlevée obtenue'].includes(k.statut)},
    {t:'Mainlevée obtenue — engagement soldé', d:null, ok:k.statut==='Mainlevée obtenue'},
  ].map(e=>`<div class="alert-row">
      <div class="alert-icon" style="background:var(--${e.ok?'green':'gray'}-soft);color:var(--${e.ok?'green':'text-tertiary'})">${icon(e.ok?'checkCircle':'clockAlert')}</div>
      <div><div class="alert-title" ${e.ok?'':'style="color:var(--text-tertiary)"'}>${esc(e.t)}</div>
      ${e.d?`<div class="alert-sub">${fmtDate(e.d)}</div>`:''}</div></div>`).join('');
  return {titre:esc(k.num), sousTitre:`${esc(k.type)} · ${esc(a.num)}`, onglets:[], ongletActif:null, corps,
    pied: k.statut === 'Mainlevée obtenue'
      ? `<button class="btn btn-secondary" onclick="toast('Attestation de mainlevée imprimée')">${icon('download')}Attestation</button>`
      : `<button class="btn btn-primary" onclick="toast('Courrier de demande de mainlevée généré dans Documents/EGTO')">Demander la mainlevée</button>
         <button class="btn btn-secondary" onclick="toast('Demande de prorogation générée')">Proroger</button>`};
};

/* ---------- Fiche retenue de garantie ---------- */
FICHES.retenue = (affaireId) => {
  const r = RETENUES.find(x=>x.affaireId===affaireId); const a = affaire(affaireId); const c = client(r.clientId);
  const solde = r.retenu - r.libere; const j = daysUntil(r.echeance);
  let corps = '';
  if(solde > 0 && j <= 60){
    corps += `<div class="callout callout-${j<0?'green':'orange'}" style="margin-bottom:16px">${icon(j<0?'checkCircle':'clockAlert')}
      <div><b>${j < 0 ? 'Retenue libérable.' : `Échéance de libération dans ${j} jours.`}</b>
      Solde immobilisé de ${fmtDA(solde)} à réclamer au maître de l’ouvrage (§4.12.2).</div></div>`;
  }
  corps += fields([
    ['Affaire', `<span class="mono-num">${esc(a.num)}</span>`], ['État', badge(r.statut)],
    ['Intitulé', esc(a.intitule), true],
    ['Client', esc(c.nom)], ['Taux de retenue', r.tauxPct + ' % sur base HT'],
    ['Montant retenu à ce jour', `<span class="mono-num">${fmtDA(r.retenu)}</span>`],
    ['Montant déjà libéré', `<span class="mono-num">${fmtDA(r.libere)}</span>`],
    ['Solde immobilisé', `<span class="mono-num" style="font-weight:700">${fmtDA(solde)}</span>`],
    ['Remplacée par une caution', r.remplaceeParCaution ? 'Oui' : 'Non'],
    ['Réception provisoire', fmtDate(r.receptionProv)], ['Réception définitive', fmtDate(r.receptionDef)],
    ['Échéance de libération', fmtDate(r.echeance)],
  ]);
  corps += sousTitre('Échéancier de libération') + `<table class="mini-table">
    <thead><tr><th>Étape</th><th>Fait générateur</th><th class="th-num">Quote-part</th><th class="th-num">Montant</th><th>État</th></tr></thead>
    <tbody>
      <tr><td class="cell-primary">Première moitié</td><td class="cell-muted">Réception provisoire — ${fmtDate(r.receptionProv)}</td>
        <td class="cell-num">50 %</td><td class="cell-num">${fmtDA(r2(r.retenu/2))}</td>
        <td>${badge(r.libere >= r2(r.retenu/2) ? 'Libérée' : 'Active')}</td></tr>
      <tr><td class="cell-primary">Seconde moitié</td><td class="cell-muted">Réception définitive — ${fmtDate(r.receptionDef)}</td>
        <td class="cell-num">50 %</td><td class="cell-num">${fmtDA(r.retenu - r2(r.retenu/2))}</td>
        <td>${badge(r.libere >= r.retenu ? 'Libérée' : 'Active')}</td></tr>
    </tbody></table>`;
  const fs = FACTURES.filter(f=>f.affaireId===affaireId && f.retenuePct);
  corps += sousTitre('Factures ayant supporté la retenue') + (fs.length ? `<table class="mini-table">
    <thead><tr><th>Document</th><th>Date</th><th class="th-num">Base HT</th><th class="th-num">Retenue</th></tr></thead>
    <tbody>${fs.map(f=>{const p=computePied(f); return `<tr onclick="openFiche('facture','${f.id}')">
      <td class="cell-primary mono-num">${esc(f.num||'Brouillon')}</td><td class="cell-muted">${fmtDate(f.date)}</td>
      <td class="cell-num">${fmtDA(p.netCommercial)}</td><td class="cell-num">${fmtDA(p.retenue)}</td></tr>`;}).join('')}</tbody></table>`
    : `<div class="text-tertiary" style="font-size:12px">Aucune facture rattachée.</div>`);
  return {titre:'Retenue — ' + esc(a.num), sousTitre:`${esc(c.sigle)} · solde ${fmtDA(solde)}`, onglets:[], ongletActif:null, corps,
    pied: solde > 0
      ? `<button class="btn btn-primary" onclick="toast('Courrier de demande de libération généré dans Documents/EGTO')">Demander la libération</button>
         <button class="btn btn-secondary" onclick="toast('Substitution par caution — écran non implémenté')">Remplacer par une caution</button>`
      : `<button class="btn btn-secondary" onclick="toast('Justificatif de libération imprimé')">${icon('download')}Justificatif</button>`};
};

/* ---------- Fiche sous-traitant ---------- */
FICHES.soustraitant = (id, onglet) => {
  const s = SOUSTRAITANTS.find(x=>x.id===id);
  const onglets = ['Identité','Contrats et situations'];
  const act = onglets.includes(onglet) ? onglet : onglets[1];
  let corps = '';

  if(act === 'Identité'){
    corps = fields([
      ['Code', `<span class="mono-num">${esc(s.code)}</span>`], ['État', badge(s.statut)],
      ['Raison sociale', esc(s.nom), true],
      ['Activité', esc(s.activite)], ['Ville', esc(s.ville)],
      ['NIF', `<span class="mono-num">${esc(s.nif)}</span>`], ['Registre de commerce', `<span class="mono-num">${esc(s.rc)}</span>`],
      ['Contact', esc(s.contact)], ['Téléphone', `<span class="mono-num">${esc(s.tel)}</span>`],
      ['Agrément', esc(s.agrement), true],
    ]);
  }

  if(act === 'Contrats et situations'){
    corps = s.contrats.length ? s.contrats.map(ct => {
      const a = affaire(ct.affaireId);
      const paye = ct.st.filter(x=>x.statut==='Payée').reduce((t,x)=>t+x.montant, 0);
      return `
      ${sousTitre(ct.num + ' — ' + a.num)}
      ${fields([
        ['Objet', esc(ct.objet), true],
        ['Montant du contrat', `<span class="mono-num">${fmtDA(ct.montant)}</span>`], ['État', badge(ct.statut)],
        ['Retenue de garantie', ct.retenuePct + ' %'], ['Avancement', ct.avancement + ' %'],
      ])}
      ${ct.st.length ? `<table class="mini-table" style="margin-top:12px">
        <thead><tr><th>N° situation</th><th>Période</th><th>Date</th><th class="th-num">Montant</th><th>État</th></tr></thead>
        <tbody>${ct.st.map(x=>`<tr>
          <td class="cell-primary mono-num">${esc(x.num)}</td><td>${esc(x.periode)}</td>
          <td class="cell-muted">${fmtDate(x.date)}</td><td class="cell-num">${fmtDA(x.montant)}</td>
          <td>${badge(x.statut)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="3" style="font-weight:600;padding-top:9px">Réglé au titre de ce contrat</td>
          <td class="cell-num" style="font-weight:700;padding-top:9px">${fmtDA(paye)}</td><td></td></tr></tfoot>
      </table>` : `<div class="text-tertiary" style="font-size:12px;margin-top:8px">Aucune situation saisie sur ce contrat.</div>`}`;
    }).join('<div class="divider"></div>')
      : `<div class="text-tertiary" style="font-size:12px">Aucun contrat de sous-traitance.</div>`;
    corps += `<div class="divider"></div><div class="callout callout-orange">${icon('lock')}
      <div>Une situation sous-traitée validée ne se modifie jamais : la correction se fait par <b>lignes négatives sur la période suivante</b>,
      afin que l’historique déclaré reste intact.</div></div>`;
  }

  return {titre:esc(s.nom), sousTitre:`${esc(s.code)} · ${esc(s.activite)}`, onglets, ongletActif:act, corps,
    pied:`<button class="btn btn-primary" onclick="toast('Nouvelle situation sous-traitée — écran non implémenté')">Nouvelle situation</button>
          <button class="btn btn-secondary" onclick="toast('Contrat imprimé dans Documents/EGTO')">${icon('download')}Imprimer le contrat</button>`};
};

/* ---------- Fiche article de catalogue ---------- */
FICHES.produit = (code) => {
  const p = produit(code);
  const usages = FACTURES.filter(f=>f.lignes.some(l=>l.code===code));
  let corps = fields([
    ['Code article', `<span class="mono-num">${esc(p.code)}</span>`], ['État', p.actif ? badge('Actif') : badge('Inactif')],
    ['Désignation', esc(p.des), true],
    ['Famille', esc(p.fam)], ['Sous-famille', esc(p.sfam)],
    ['Classification', famBadge(p.classe)], ['Unité de mesure', esc(p.u)],
    ['Prix unitaire HT', `<span class="mono-num" style="font-weight:700">${fmtDA(p.pu)}</span>`],
    ['Taux de TVA', TVA_TAUX + ' % — verrouillé au niveau de l’article'],
  ]);
  corps += `<div class="divider"></div><div class="callout callout-blue">${icon('info')}
    <div>La classification <b>${p.classe}</b> provient de la sous-famille « ${esc(p.sfam)} ». Elle est recopiée en instantané
    sur chaque ligne de déclaration mensuelle : une modification ici n’altère aucune période déjà déclarée.</div></div>`;
  if(!p.actif){
    corps += `<div class="callout callout-orange" style="margin-top:12px">${icon('alertTriangle')}
      <div>Article désactivé : il n’apparaît plus dans les listes de saisie mais reste lisible sur tous les documents historiques.</div></div>`;
  }
  corps += sousTitre('Documents utilisant cet article') + (usages.length ? `<table class="mini-table">
    <thead><tr><th>Document</th><th>Client</th><th class="th-num">Quantité</th><th class="th-num">Montant HT</th></tr></thead>
    <tbody>${usages.map(f=>{ const l = f.lignes.find(x=>x.code===code); return `<tr onclick="openFiche('facture','${f.id}')">
      <td class="cell-primary mono-num">${esc(f.num||'Brouillon')}</td><td class="cell-muted">${esc(client(f.clientId).sigle)}</td>
      <td class="cell-num">${groupInt(Math.abs(l.qte))} ${esc(l.u)}</td>
      <td class="cell-num">${fmtDA(ligneMontants(l).net)}</td></tr>`; }).join('')}</tbody></table>`
    : `<div class="text-tertiary" style="font-size:12px">Cet article n’a encore été utilisé sur aucun document.</div>`);
  return {titre:esc(p.code), sousTitre:esc(p.des), onglets:[], ongletActif:null, corps,
    pied:`<button class="btn btn-primary" onclick="toast('Modification de l’article — écran non implémenté')">Modifier</button>
          ${p.actif ? `<button class="btn btn-danger" onclick="toast('Article désactivé — jamais supprimé physiquement')">Désactiver</button>`
                    : `<button class="btn btn-secondary" onclick="toast('Article réactivé')">Réactiver</button>`}`};
};

/* ============================================================
   DÉMARRAGE
============================================================ */
document.querySelectorAll('#densitySwitch button').forEach(b =>
  b.addEventListener('click', () => setDensite(b.dataset.density)));
$('#overlay').addEventListener('click', closeFiche);
$('#modalOverlay').addEventListener('click', e => { if(e.target.id === 'modalOverlay') closeModal(); });
document.querySelectorAll('.traffic-lights .tl').forEach(t =>
  t.addEventListener('click', () => toast('Contrôle de fenêtre — inactif dans la maquette')));

setDensite('normal');
render();
</script>
</body>
</html>
