<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGTO — Gestion Commerciale</title>
<style>
/* ============================================================
   RESET
============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-size:13px;
  color:var(--text-primary);
  background:var(--bg-window);
  transition:background-color .25s ease;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
ul{list-style:none;}
a{color:inherit;text-decoration:none;}
svg{display:block;flex-shrink:0;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:10px;border:2px solid transparent;background-clip:padding-box;}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);background-clip:padding-box;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

/* ============================================================
   DESIGN TOKENS — LIGHT
============================================================ */
:root{
  --bg-window:#EDEDEF;
  --bg-sidebar:#F6F6F8;
  --bg-topbar:#F6F6F8;
  --bg-content:#FFFFFF;
  --bg-card:#FFFFFF;
  --bg-input:#FFFFFF;
  --bg-hover:rgba(0,0,0,.045);
  --bg-active-row:rgba(0,113,227,.08);
  --text-primary:#1D1D1F;
  --text-secondary:#6E6E73;
  --text-tertiary:#A1A1A6;
  --separator:rgba(0,0,0,.09);
  --separator-strong:rgba(0,0,0,.14);
  --accent:#0071E3;
  --accent-hover:#0077ED;
  --accent-soft:rgba(0,113,227,.1);
  --green:#248A3D; --green-soft:rgba(52,199,89,.15);
  --orange:#C76A00; --orange-soft:rgba(255,149,0,.16);
  --red:#D70015; --red-soft:rgba(255,59,48,.13);
  --purple:#8E44C9; --purple-soft:rgba(175,82,222,.14);
  --gray-soft:rgba(110,110,115,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 6px 20px rgba(0,0,0,.10);
  --shadow-lg:0 20px 60px rgba(0,0,0,.22);
  --radius-window:12px;
  --radius-panel:10px;
  --radius-ctl:7px;
  --tl-red:#FF5F57; --tl-yellow:#FEBC2E; --tl-green:#28C840;
}
[data-theme="dark"]{
  --bg-window:#151517;
  --bg-sidebar:#232326;
  --bg-topbar:#232326;
  --bg-content:#1C1C1E;
  --bg-card:#2A2A2D;
  --bg-input:#313134;
  --bg-hover:rgba(255,255,255,.07);
  --bg-active-row:rgba(10,132,255,.16);
  --text-primary:#F5F5F7;
  --text-secondary:#A1A1A6;
  --text-tertiary:#75757A;
  --separator:rgba(255,255,255,.09);
  --separator-strong:rgba(255,255,255,.16);
  --accent:#0A84FF;
  --accent-hover:#3399FF;
  --accent-soft:rgba(10,132,255,.18);
  --green:#32D74B; --green-soft:rgba(50,215,75,.18);
  --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.18);
  --red:#FF453A; --red-soft:rgba(255,69,58,.18);
  --purple:#BF5AF2; --purple-soft:rgba(191,90,242,.18);
  --gray-soft:rgba(161,161,166,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 20px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.55);
}

/* ============================================================
   APP SHELL
============================================================ */
.app{
  display:grid;
  grid-template-columns:250px 1fr;
  grid-template-rows:52px 1fr 26px;
  height:100vh; width:100vw;
  background:var(--bg-content);
  transition:grid-template-columns .22s cubic-bezier(.32,.72,0,1);
}
.app.sidebar-collapsed{grid-template-columns:74px 1fr;}
.app.sidebar-collapsed .sidebar{opacity:0;pointer-events:none;}

/* ---- Titlebar / Toolbar (macOS : feux tricolores à gauche, fusionnés) ---- */
.topbar-sidebar-zone{
  grid-column:1; grid-row:1;
  display:flex; align-items:center; padding:0 16px;
  background:color-mix(in srgb,var(--bg-sidebar) 80%,transparent);
  backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  -webkit-app-region:drag;
}
.traffic-lights{display:flex; gap:8px;}
.tl{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);}
.tl-red{background:var(--tl-red);} .tl-yellow{background:var(--tl-yellow);} .tl-green{background:var(--tl-green);}

.topbar-content-zone{
  grid-column:2; grid-row:1;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:0 20px;
  background:color-mix(in srgb,var(--bg-topbar) 80%,transparent);
  backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-bottom:1px solid var(--separator);
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
.view-title{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.search-field{
  display:flex;align-items:center;gap:6px;
  background:var(--bg-hover); border-radius:7px;
  padding:5px 10px; width:230px; color:var(--text-tertiary);
}
.search-field input{background:none;border:none;color:var(--text-primary);width:100%;font-size:12.5px;outline:none;}
.search-field input::placeholder{color:var(--text-tertiary);}
.search-field svg{width:14px;height:14px;color:var(--text-tertiary);}
kbd.k{
  font-family:inherit;font-size:10.5px;color:var(--text-tertiary);
  border:1px solid var(--separator-strong);border-radius:4px;
  padding:0 4px;line-height:15px;white-space:nowrap;flex-shrink:0;
}

.icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:7px;color:var(--text-secondary);
  transition:background-color .12s ease;
}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary);}
.icon-btn svg{width:16px;height:16px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;
  transition:background-color .12s ease, opacity .12s ease;
  white-space:nowrap;
}
.btn svg{width:14px;height:14px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-secondary{background:var(--bg-hover);color:var(--text-primary);}
.btn-secondary:hover{background:var(--separator-strong);}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-ghost{color:var(--text-secondary);}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary);}
.btn-sm{padding:3px 9px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:default;}

/* ---- Sidebar (vibrancy) ---- */
.sidebar{
  grid-column:1; grid-row:2;
  background:color-mix(in srgb,var(--bg-sidebar) 80%,transparent);
  backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-right:1px solid var(--separator);
  display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden;
  padding:4px 10px 10px;
  transition:opacity .16s ease;
}
.sidebar-section{margin-top:14px;}
.sidebar-section:first-child{margin-top:6px;}
.sidebar-section-title{
  font-size:11px;font-weight:600;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.03em;padding:4px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;
  width:100%;padding:6px 10px;border-radius:7px;
  font-size:13px;color:var(--text-primary);text-align:left;
  transition:background-color .1s ease;
}
.nav-item svg{width:16px;height:16px;color:var(--text-secondary);flex-shrink:0;}
.nav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item:hover{background:var(--bg-hover);}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item.active svg{color:#fff;}
.nav-item .nav-badge{
  margin-left:auto;font-size:10.5px;font-weight:600;
  background:var(--red);color:#fff;border-radius:8px;padding:1px 6px;flex-shrink:0;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.3);}
.sidebar-footer{margin-top:auto;padding-top:10px;border-top:1px solid var(--separator);}
.user-chip{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;}
.user-chip:hover{background:var(--bg-hover);}
.avatar{
  width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#0071E3,#8E44C9);
  color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.user-name{font-size:12px;font-weight:600;}
.user-sub{font-size:11px;color:var(--text-tertiary);}

/* ---- Content ---- */
.content{grid-column:2; grid-row:2; background:var(--bg-content); overflow-y:auto; position:relative;}
.view-content{padding:22px 26px 60px;max-width:1400px;}
.view-content.narrow{max-width:980px;}
.section-heading{
  font-size:11px;font-weight:600;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.04em;margin:28px 0 10px;
}
.section-heading:first-child{margin-top:0;}

/* ---- Status bar (poste unique, hors ligne, chiffrement) ---- */
.statusbar{
  grid-column:1/-1; grid-row:3;
  display:flex;align-items:center;gap:16px;
  padding:0 14px;font-size:11px;color:var(--text-tertiary);
  background:color-mix(in srgb,var(--bg-sidebar) 80%,transparent);
  backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-top:1px solid var(--separator);
}
.statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap;}
.statusbar b{font-weight:600;color:var(--text-secondary);}
.statusbar .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.statusbar .spacer{margin-left:auto;}
.segmented{display:flex;background:var(--bg-hover);border-radius:5px;padding:1px;gap:1px;}
.segmented button{
  font-size:10.5px;padding:1px 7px;border-radius:4px;color:var(--text-tertiary);line-height:16px;
}
.segmented button.active{background:var(--bg-card);color:var(--text-primary);font-weight:600;box-shadow:var(--shadow-sm);}
</style>
<style>
/* ============================================================
   COMPOSANTS
============================================================ */

/* Cartes */
.card{background:var(--bg-card);border:1px solid var(--separator);border-radius:var(--radius-panel);box-shadow:var(--shadow-sm);}
.card-pad{padding:16px 18px;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kpi-card{background:var(--bg-card);border:1px solid var(--separator);border-radius:var(--radius-panel);padding:14px 16px 15px;box-shadow:var(--shadow-sm);}
.kpi-label{font-size:11.5px;color:var(--text-secondary);font-weight:500;margin-bottom:8px;}
.kpi-value{font-size:21px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;}
.kpi-trend{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11.5px;font-weight:600;}
.kpi-trend svg{width:12px;height:12px;}
.trend-up{color:var(--green);} .trend-down{color:var(--red);}
.kpi-trend .muted{color:var(--text-tertiary);font-weight:400;margin-left:2px;}

/* Badges — fond plein, sans pastille */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2.5px 8px;border-radius:6px;white-space:nowrap;}
.badge-green{background:var(--green-soft);color:var(--green);}
.badge-orange{background:var(--orange-soft);color:var(--orange);}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-blue{background:var(--accent-soft);color:var(--accent);}
.badge-purple{background:var(--purple-soft);color:var(--purple);}
.badge-gray{background:var(--gray-soft);color:var(--text-secondary);}

/* Tableaux */
.table-wrap{background:var(--bg-card);border:1px solid var(--separator);border-radius:var(--radius-panel);overflow:hidden;box-shadow:var(--shadow-sm);}
table.mac-table{width:100%;border-collapse:collapse;}
.mac-table thead th{
  text-align:left;font-size:11px;font-weight:600;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.03em;
  padding:9px 14px;border-bottom:1px solid var(--separator);background:var(--bg-card);
  position:sticky;top:0;z-index:1;
}
.mac-table td{padding:10px 14px;border-bottom:1px solid var(--separator);font-size:12.5px;vertical-align:middle;}
.mac-table tbody tr{cursor:pointer;transition:background-color .08s ease;}
.mac-table tbody tr:hover{background:var(--bg-hover);}
.mac-table tbody tr.is-selected{background:var(--bg-active-row);}
.mac-table tbody tr:last-child td{border-bottom:none;}
.mac-table tfoot td{padding:9px 14px;font-size:12px;font-weight:600;background:var(--bg-hover);border-top:1px solid var(--separator);}
.mac-table .cell-primary{font-weight:600;color:var(--text-primary);}
.mac-table .cell-muted{color:var(--text-secondary);}
.mac-table .cell-num,.mini-table .cell-num{font-variant-numeric:tabular-nums;text-align:right;}
.mac-table th.th-num,.mini-table th.th-num{text-align:right;}
.mac-table .cell-icon-row{display:flex;align-items:center;gap:9px;}
.row-avatar{width:24px;height:24px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* Densité compacte (⌘⌥1 / ⌘⌥2) */
.app.dense .mac-table td{padding:5px 14px;font-size:12px;}
.app.dense .mac-table thead th{padding:6px 14px;}
.app.dense .row-avatar{width:20px;height:20px;font-size:9px;}

/* Barre d'outils de liste */
.list-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.chip-filters{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:500;background:var(--bg-hover);color:var(--text-secondary);border:1px solid transparent;}
.chip.active{background:var(--accent-soft);color:var(--accent);}
.chip:hover{background:var(--separator-strong);}
.chip.active:hover{background:var(--accent-soft);}

/* Bandeaux d'alerte non bloquants — disponibles sur toute vue */
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:9px;font-size:12.5px;line-height:1.5;margin-bottom:14px;}
.banner svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
.banner .banner-body{flex:1;}
.banner b{font-weight:700;}
.banner a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
.banner .banner-close{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;opacity:.65;flex-shrink:0;}
.banner .banner-close:hover{opacity:1;background:rgba(0,0,0,.08);}
.banner .banner-close svg{width:11px;height:11px;margin:0;}
.banner-orange{background:var(--orange-soft);color:var(--orange);}
.banner-red{background:var(--red-soft);color:var(--red);}
.banner-blue{background:var(--accent-soft);color:var(--accent);}
.banner-green{background:var(--green-soft);color:var(--green);}

/* Progression */
.progress-bar{width:70px;height:5px;border-radius:3px;background:var(--gray-soft);overflow:hidden;}
.progress-bar > div{height:100%;background:var(--accent);border-radius:3px;}

/* État vide */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;color:var(--text-tertiary);text-align:center;}
.empty-state svg{width:38px;height:38px;margin-bottom:12px;opacity:.5;}
.empty-state-title{font-size:13.5px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;}
.empty-state-sub{font-size:12px;max-width:320px;}

/* Graphiques */
.chart-card{background:var(--bg-card);border:1px solid var(--separator);border-radius:var(--radius-panel);padding:16px 18px;box-shadow:var(--shadow-sm);}
.chart-title{font-size:12.5px;font-weight:600;margin-bottom:2px;}
.chart-sub{font-size:11px;color:var(--text-tertiary);margin-bottom:14px;}
.bar-chart{display:flex;align-items:flex-end;gap:9px;height:130px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-chart .bar{width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--accent);transition:height .5s cubic-bezier(.4,0,.2,1);}
.bar-chart .bar.is-muted{background:var(--gray-soft);}
.bar-chart .bar-label{font-size:10px;color:var(--text-tertiary);}
.donut-wrap{display:flex;align-items:center;gap:22px;}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;
  -webkit-mask:radial-gradient(circle,transparent 47%,#000 48%);mask:radial-gradient(circle,transparent 47%,#000 48%);}
.donut-legend{display:flex;flex-direction:column;gap:9px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.legend-label{color:var(--text-secondary);min-width:60px;}
.legend-val{font-weight:600;font-variant-numeric:tabular-nums;}

/* Liste d'alertes du tableau de bord */
.alert-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--separator);}
.alert-row:last-child{border-bottom:none;}
.alert-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.alert-icon svg{width:14px;height:14px;}
.alert-title{font-size:12.5px;font-weight:600;}
.alert-sub{font-size:11.5px;color:var(--text-secondary);margin-top:1px;}

/* Grilles */
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.stack{display:flex;flex-direction:column;gap:14px;}

/* Panneau coulissant — pattern de détail unique pour tous les modules */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40;}
.overlay.open{opacity:1;pointer-events:auto;}
.detail-panel{
  position:fixed;top:0;right:0;bottom:0;width:660px;max-width:92vw;
  background:var(--bg-content);box-shadow:var(--shadow-lg);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  z-index:41;display:flex;flex-direction:column;
}
.detail-panel.open{transform:translateX(0);}
.detail-header{padding:16px 22px;border-bottom:1px solid var(--separator);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.detail-title{font-size:16px;font-weight:700;letter-spacing:-.01em;}
.detail-subtitle{font-size:12px;color:var(--text-secondary);margin-top:3px;}
.detail-close{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex-shrink:0;}
.detail-close:hover{background:var(--bg-hover);}
.detail-close svg{width:14px;height:14px;}
.detail-tabs{display:flex;padding:0 22px;border-bottom:1px solid var(--separator);overflow-x:auto;}
.detail-tab{padding:10px 4px;margin-right:20px;font-size:12.5px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap;}
.detail-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.detail-body{flex:1;overflow-y:auto;padding:20px 22px 40px;}
.detail-footer{padding:12px 22px;border-top:1px solid var(--separator);display:flex;gap:8px;background:var(--bg-card);}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
.field{display:flex;flex-direction:column;gap:3px;}
.field-label{font-size:11px;color:var(--text-tertiary);font-weight:500;}
.field-value{font-size:13px;font-weight:500;}
.field-value.mono,.mono{font-variant-numeric:tabular-nums;}
.field.span-2{grid-column:1/-1;}
.divider{height:1px;background:var(--separator);margin:18px 0;}

.mini-table{width:100%;border-collapse:collapse;font-size:12px;}
.mini-table th{text-align:left;font-size:10.5px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.02em;padding:6px 8px;border-bottom:1px solid var(--separator);}
.mini-table td{padding:8px;border-bottom:1px solid var(--separator);}
.mini-table tr:last-child td{border-bottom:none;}
.mini-table tbody tr[onclick]{cursor:pointer;}
.mini-table tbody tr[onclick]:hover{background:var(--bg-hover);}
</style>
<style>
/* ---- Pied de facture (§4.4.6) ---- */
.pied{font-size:12.5px;}
.pied .pl{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:5px 0;color:var(--text-secondary);}
.pied .pl > span:last-child{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;}
.pied .pl .hint{font-weight:400;color:var(--text-tertiary);font-size:11px;}
.pied .pl.sub{color:var(--text-primary);font-weight:600;border-top:1px solid var(--separator);margin-top:3px;padding-top:7px;}
.pied .pl.sub > span:last-child{font-weight:700;}
.pied .pnet{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  margin-top:10px;padding:11px 13px;border-radius:9px;background:var(--bg-hover);
  border-top:2px solid var(--text-primary);
}
.pied .pnet b{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.pied .pnet strong{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.pied .pnote{font-size:11px;color:var(--text-tertiary);margin-top:8px;line-height:1.5;}

/* ---- Formulaires + validation en ligne ---- */
.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-row label{font-size:12px;font-weight:600;color:var(--text-secondary);}
.form-control{
  background:var(--bg-input);border:1px solid var(--separator-strong);border-radius:7px;
  padding:7px 10px;font-size:13px;color:var(--text-primary);width:100%;outline:none;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-control.mono{font-variant-numeric:tabular-nums;}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.form-hint{font-size:11px;color:var(--text-tertiary);line-height:1.45;}
.field-error{display:none;align-items:flex-start;gap:5px;font-size:11.5px;color:var(--red);line-height:1.45;}
.field-error svg{width:12px;height:12px;flex-shrink:0;margin-top:2px;}
.form-row.invalid .form-control{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
.form-row.invalid .field-error{display:flex;}
.form-row.invalid .form-hint{display:none;}
.form-row.valid .form-control{border-color:var(--green);}

/* ---- Paramétrage ---- */
.settings-layout{display:grid;grid-template-columns:190px 1fr;gap:24px;}
.settings-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:start;}
.settings-nav button{padding:7px 10px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--text-secondary);}
.settings-nav button:hover{background:var(--bg-hover);}
.settings-nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.settings-group-title{font-size:15px;font-weight:700;margin-bottom:3px;}
.settings-group-sub{font-size:12px;color:var(--text-secondary);margin-bottom:16px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--separator);gap:16px;}
.settings-row:last-child{border-bottom:none;}
.settings-row-label{font-size:13px;font-weight:500;}
.settings-row-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:2px;}
.switch{position:relative;width:36px;height:21px;border-radius:11px;background:var(--gray-soft);flex-shrink:0;transition:background-color .15s ease;cursor:pointer;}
.switch.on{background:var(--green);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s ease;}
.switch.on::after{transform:translateX(15px);}

/* ---- Encadrés ---- */
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:9px;font-size:12.5px;line-height:1.5;}
.callout svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
.callout-blue{background:var(--accent-soft);color:var(--accent);}
.callout-orange{background:var(--orange-soft);color:var(--orange);}
.callout-green{background:var(--green-soft);color:var(--green);}
.callout-red{background:var(--red-soft);color:var(--red);}
.callout b{font-weight:700;}

/* ---- Modale de confirmation (action irréversible) ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;z-index:60;}
.modal-overlay.open{display:flex;}
.modal{
  width:480px;max-width:calc(100vw - 40px);background:var(--bg-card);
  border-radius:var(--radius-window);box-shadow:var(--shadow-lg);
  padding:22px 24px 18px;text-align:center;
  animation:modalIn .22s cubic-bezier(.32,.72,0,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.96);}}
.modal-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;background:var(--orange-soft);color:var(--orange);}
.modal-icon svg{width:22px;height:22px;}
.modal h3{font-size:15px;font-weight:700;margin-bottom:6px;}
.modal p{font-size:12.5px;color:var(--text-secondary);line-height:1.55;}
.modal .modal-detail{margin-top:14px;text-align:left;}
.modal .modal-actions{display:flex;gap:8px;margin-top:20px;}
.modal .modal-actions .btn{flex:1;justify-content:center;padding:7px 12px;font-size:13px;}

/* ---- Toast ---- */
.toast-zone{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{
  display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:9px;
  background:var(--bg-card);border:1px solid var(--separator);box-shadow:var(--shadow-md);
  font-size:12.5px;font-weight:500;animation:toastIn .2s ease;
  transition:opacity .3s ease,transform .3s ease;
}
.toast svg{width:15px;height:15px;color:var(--green);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}}

/* ---- Aide clavier ---- */
.shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;}
.shortcut-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0;}
.shortcut-row span{color:var(--text-secondary);}
.shortcut-row kbd{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--text-primary);background:var(--bg-hover);border-radius:5px;padding:2px 7px;white-space:nowrap;}

/* ---- Utilitaires ---- */
.flex{display:flex;} .flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-6{gap:6px;} .gap-8{gap:8px;} .gap-10{gap:10px;} .gap-12{gap:12px;}
.text-secondary{color:var(--text-secondary);} .text-tertiary{color:var(--text-tertiary);}
.mono-num{font-variant-numeric:tabular-nums;}
.w-full{width:100%;} .mt-14{margin-top:14px;} .mt-16{margin-top:16px;}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
@media (max-width:1000px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2,.grid-3,.field-grid,.form-2col,.shortcut-grid{grid-template-columns:1fr;}
  .settings-layout{grid-template-columns:1fr;}
}
</style>

const TODAY = new Date('2026-08-08T00:00:00');
const NBSP = ' '; /* espace fine insécable */

function groupInt(n){
  const s = String(n); let out = '';
  for(let i=0;i<s.length;i++){ if(i>0 && (s.length-i)%3===0) out += NBSP; out += s[i]; }
  return out;
}
/* Montants stockés en centimes (§10.3) — affichage 2 décimales sur les documents */
function fmtDA(cent){
  const neg = cent < 0; const v = Math.abs(Math.round(cent));
  return (neg?'− ':'') + groupInt(Math.floor(v/100)) + ',' + String(v%100).padStart(2,'0') + ' DA';
}
/* Agrégats de pilotage : arrondi au dinar */
function fmtDAc(cent){
  const neg = cent < 0; const v = Math.abs(Math.round(cent/100));
  return (neg?'− ':'') + groupInt(v) + ' DA';
}
function DA(dinars){ return Math.round(dinars*100); } /* saisie des données mock en dinars */
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function daysUntil(iso){ return Math.round((new Date(iso+'T00:00:00') - TODAY)/86400000); }
function initials(str){ return str.split(/[\s'’-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Arrondi 2 décimales half-up, appliqué ligne par ligne puis au total (§10.3) */

/* ---------- Barème du droit de timbre (§4.7.3) — paramétrable en base ---------- */
const BAREME_TIMBRE = {
  modesSoumis:['Espèces','Chèque','Traite'],
  tranches:[
    {jusqua:DA(300), taux:0},
    {jusqua:DA(30000), taux:1},
    {jusqua:DA(100000), taux:1.5},
    {jusqua:null, taux:2},
  ],
  plancher:DA(5), plafond:DA(10000),
};
function timbreBareme(ttc, mode){
  if(!BAREME_TIMBRE.modesSoumis.includes(mode)) return 0;
  if(ttc <= 0) return 0;
  const t = BAREME_TIMBRE.tranches.find(t => t.jusqua===null || ttc <= t.jusqua);
  if(!t || t.taux === 0) return 0;
  let v = r2(ttc * t.taux / 100);
  if(v < BAREME_TIMBRE.plancher) v = BAREME_TIMBRE.plancher;
  if(v > BAREME_TIMBRE.plafond) v = BAREME_TIMBRE.plafond;
  return v;
}
const TVA_TAUX = 19;

/* ---------- Pied de facture (§4.4.6) — ordre strict, arrondi ligne puis total ---------- */
function ligneMontants(l){
  const brut = r2(l.qte * l.pu);
  const remise = r2(brut * (l.remisePct||0) / 100);
  return {brut, remise, net: brut - remise};
}
function computePied(doc){
  let totalBrut = 0, totalRemises = 0;
  doc.lignes.forEach(l => { const m = ligneMontants(l); totalBrut += m.brut; totalRemises += m.remise; });
  totalBrut = r2(totalBrut); totalRemises = r2(totalRemises);
  const apresRemises  = totalBrut - totalRemises;
  const rabais        = r2(apresRemises * (doc.rabaisPct||0) / 100);
  const netCommercial = apresRemises - rabais;
  const avance        = r2(netCommercial * (doc.avancePct||0) / 100);
  const retenue       = r2(netCommercial * (doc.retenuePct||0) / 100);
  const totalHT       = netCommercial - avance - retenue;
  const tva           = r2(totalHT * TVA_TAUX / 100);
  const ttc           = totalHT + tva;
  const timbre        = timbreBareme(ttc, doc.mode);
  return {totalBrut, totalRemises, rabais, netCommercial, avance, retenue, totalHT, tva, ttc, timbre, net: ttc + timbre};
}

/* ---------- Dérivés ---------- */
function client(id){ return CLIENTS.find(c=>c.id===id) || {nom:'—', sigle:'—'}; }
function affaire(id){ return AFFAIRES.find(a=>a.id===id) || null; }
function retardJours(f){ return f.statut==='Payée' || f.statut==='Brouillon' ? 0 : Math.max(0, -daysUntil(f.echeance)); }
function facturesEchues(){ return FACTURES.filter(f=>f.type!=='AV' && retardJours(f) > 0); }
function cautionsAlerte(){ return CAUTIONS.filter(c=>c.statut!=='Mainlevée obtenue' && daysUntil(c.expiration) <= 30); }
function encaissementsDe(fid){ return ENCAISSEMENTS.filter(e=>e.factureId===fid); }
function resteDu(f){
  const n = computePied(f).net;
  const paye = encaissementsDe(f.id).reduce((s,e)=>s+e.montant,0);
  return n - paye;
}
function blDe(affId){ return BONS_LIVRAISON.filter(b=>b.affaireId===affId); }

/* ---------- Recherche générique ---------- */
function match(obj, keys){
  const q = state.q.trim().toLowerCase(); if(!q) return true;
  return keys.some(k => String(k==null?'':k).toLowerCase().includes(q));
}
function chips(groupe, valeurs, courant){
  return `<div class="chip-filters">${valeurs.map(v =>
    `<button class="chip ${(courant||'Tous')===v?'active':''}" onclick="setFiltre('${groupe}','${v}')">${esc(v)}</button>`).join('')}</div>`;
}
function setFiltre(g,v){ state.filtre[g] = v; renderContent(); }
function fTest(g, val){ const f = state.filtre[g]; return !f || f==='Tous' || f===val; }
function vide(titre, sub){
  return `<div class="empty-state">${icon('fileEmpty')}<div class="empty-state-title">${esc(titre)}</div><div class="empty-state-sub">${esc(sub)}</div></div>`;
}
function tableWrap(head, rows, foot){
  if(!rows) return `<div class="table-wrap">${vide('Aucun résultat','Aucune ligne ne correspond à la recherche ou aux filtres actifs.')}</div>`;
  return `<div class="table-wrap"><table class="mac-table">
    <thead><tr>${head}</tr></thead><tbody>${rows}</tbody>${foot?`<tfoot><tr>${foot}</tr></tfoot>`:''}</table></div>`;
}

/* ============================================================
   PANNEAU COULISSANT — pattern unique de consultation de fiche
============================================================ */
function openFiche(type, id){
  const build = FICHES[type]; if(!build) return;
  state.fiche = {type, id};
  const key = type+':'+id;
  const f = build(id, state.onglet[key] || null);
  state.onglet[key] = f.ongletActif;
  $('#detailPanel').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-title">${f.titre}</div>
        <div class="detail-subtitle">${f.sousTitre}</div>
      </div>
      <button class="detail-close" onclick="closeFiche()" aria-label="Fermer">${icon('x')}</button>
    </div>
    ${f.onglets && f.onglets.length>1 ? `<div class="detail-tabs">${f.onglets.map(o=>
      `<button class="detail-tab ${o===f.ongletActif?'active':''}" onclick="switchOnglet('${esc(o)}')">${esc(o)}</button>`).join('')}</div>` : ''}
    <div class="detail-body">${f.corps}</div>
    ${f.pied ? `<div class="detail-footer">${f.pied}</div>` : ''}`;
  $('#detailPanel').classList.add('open');
  $('#overlay').classList.add('open');
}
function switchOnglet(o){
  if(!state.fiche) return;
  state.onglet[state.fiche.type+':'+state.fiche.id] = o;
  openFiche(state.fiche.type, state.fiche.id);
}
function closeFiche(){
  state.fiche = null;
  $('#detailPanel').classList.remove('open');
  $('#overlay').classList.remove('open');
}

      <button class="btn btn-secondary" onclick="closeModal()">${esc(o.annuler||'Annuler')}</button>
      <button class="btn ${o.ton==='red'?'btn-danger':'btn-primary'}" onclick="confirmModal()">${esc(o.confirmer||'Confirmer')}</button>
    </div>`;
  $('#modalOverlay').classList.add('open');
}
function closeModal(){ $('#modalOverlay').classList.remove('open'); modalAction = null; }
function confirmModal(){ const a = modalAction; closeModal(); if(a) a(); }

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';

}

  openModal({ico:'keyboard', titre:'Raccourcis clavier', texte:'Les combinaisons suivent les conventions macOS : la touche ⌘ remplace Ctrl.',
    detail:`<div class="shortcut-grid">${RACCOURCIS.map(([k,l])=>`<div class="shortcut-row"><span>${esc(l)}</span><kbd>${k}</kbd></div>`).join('')}</div>`,
    annuler:'Fermer', confirmer:'Compris'});
}
document.addEventListener('keydown', e => {
  const cmd = e.metaKey || e.ctrlKey;
  if(e.key === 'Escape'){
    if($('#modalOverlay').classList.contains('open')) closeModal();
    else if(state.fiche) closeFiche();
    else if(state.q){ state.q=''; render(); }
    return;
  }
  if(!cmd) return;
  if(e.key >= '1' && e.key <= '9'){
    const it = NAV_FLAT[parseInt(e.key,10)-1];
    if(it){ e.preventDefault(); goto(it.id); }
    return;
  }
  const k = e.key.toLowerCase();
  if(k === 'f'){ const i = $('#searchInput'); if(i){ e.preventDefault(); i.focus(); i.select(); } }
  else if(k === 'b'){ e.preventDefault(); toggleSidebar(); }
  else if(k === 'd'){ e.preventDefault(); setDensite(state.densite==='dense'?'normal':'dense'); }
  else if(k === 'l' && e.shiftKey){ e.preventDefault(); toggleTheme(); }
  else if(k === 'n'){ e.preventDefault(); const l = NEW_LABEL[state.vue]; if(l) toast(l + ' — écran de saisie non implémenté dans la maquette'); }
  else if(e.key === '/'){ e.preventDefault(); openRaccourcis(); }
});

/* Validation en ligne — NIF algérien : 15 chiffres exactement */
function validerNIF(el){
  const row = el.closest('.form-row');
  const v = el.value.replace(/\s/g,'');
  row.classList.remove('invalid','valid');
  const msg = row.querySelector('.field-error span');
  if(v === '') return;
  if(!/^\d+$/.test(v)){ msg.textContent = 'Le NIF ne doit contenir que des chiffres — caractère non numérique détecté.'; row.classList.add('invalid'); return; }
  if(v.length !== 15){ msg.textContent = `Le NIF doit comporter exactement 15 chiffres — ${v.length} saisi${v.length>1?'s':''}.`; row.classList.add('invalid'); return; }
  row.classList.add('valid');
}
function validerNIS(el){
  const row = el.closest('.form-row'); const v = el.value.replace(/\s/g,'');
  row.classList.remove('invalid','valid');
  if(v === '') return;
  if(!/^\d{13}$/.test(v)){ row.querySelector('.field-error span').textContent = `Le NIS doit comporter exactement 13 chiffres — ${v.length} saisi${v.length>1?'s':''}.`; row.classList.add('invalid'); return; }
  row.classList.add('valid');
}

        `<div class="segmented"><button class="${state.densite==='normal'?'active':''}" onclick="setDensite('normal');renderContent()">Normale</button><button class="${state.densite==='dense'?'active':''}" onclick="setDensite('dense');renderContent()">Compacte</button></div>`)}
      ${srow('Animations d’interface','Transitions des panneaux et des feuilles', sw('animations'))}

  return `<div class="settings-layout">

function confirmerPhrase(){

    detail:`<div class="callout callout-orange">${icon('lock')}<div>La nouvelle phrase de 24 mots ne sera affichée <b>qu’une seule fois</b>. Transcrivez-la et remettez-la à la direction avant de fermer la fenêtre.</div></div>`,
