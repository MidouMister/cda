appId: com.egto.gestion-commerciale
productName: "EGTO - Gestion Commerciale"
copyright: "© 2026 E.G.T.O - Entreprise des Grands Travaux de l'Ouest"
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**/*
  - node_modules/argon2/**/*
  - out/main/egto-admin-reset.js
  - out/main/chunks/**/*
extraResources:
  - from: "./electron/db/schema.sql"
    to: "db/schema.sql"
  - from: "./electron/db/migrations"
    to: "db/migrations"
  - from: "./assets/fonts"
    to: "assets/fonts"
  - from: "./docs/manuel-utilisateur.pdf"
    to: "docs/manuel-utilisateur.pdf"
win:
  target:
    - target: nsis
      arch: x64
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "EGTO Gestion Commerciale"